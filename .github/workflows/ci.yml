name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Maven tests (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install JavaFX desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth openbox wmctrl libgtk-3-0t64 libxtst6 libxrender1 libxi6 libasound2t64
      - name: Run full test suite in a managed virtual display
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' bash -ec '
            openbox > /tmp/daymark-openbox.log 2>&1 &
            for i in {1..15}; do
              wmctrl -m > /dev/null 2>&1 && break
              sleep 1
            done
            wmctrl -m
            mvn --batch-mode --no-transfer-progress test
          '
      - name: Capture dependency tree
        if: always()
        run: mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputFile=target/dependency-tree.txt
      - name: Upload test and dependency reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-test-reports
          path: |
            target/surefire-reports/**
            target/dependency-tree.txt
          if-no-files-found: warn
          retention-days: 14

  windows-msi:
    name: Package and smoke-test Windows MSI
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Locate WiX Toolset 3
        shell: pwsh
        run: |
          $wixDirs = @(
            (Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'),
            (Join-Path $env:ProgramFiles 'WiX Toolset v3.14\bin')
          )
          $wixDir = $wixDirs | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (-not $wixDir) { throw 'WiX 3 candle.exe was not found in the standard install locations.' }
          Add-Content -Path $env:GITHUB_PATH -Value $wixDir
      - name: Build MSI
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Type msi
      - name: Install MSI on fresh runner
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'target/dist' -Filter 'Daymark-*.msi')
          if ($packages.Count -ne 1) { throw 'Expected one Daymark MSI.' }
          $msi = '"' + $packages[0].FullName + '"'
          $process = Start-Process msiexec.exe -WindowStyle Hidden -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "MSI installation failed with exit code $($process.ExitCode)" }
      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $launcher = Join-Path $env:ProgramFiles 'Daymark/Daymark.exe'
          if (-not (Test-Path $launcher)) { throw "Installed launcher not found: $launcher" }
          ./scripts/smoke-windows.ps1 -Launcher $launcher
      - name: Upload MSI
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: daymark-windows-msi
          path: target/dist/Daymark-*.msi
          if-no-files-found: error
          retention-days: 14
